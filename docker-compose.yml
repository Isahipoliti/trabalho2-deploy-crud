services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: crud_produtos
      DB_USER: crud_user
      DB_PASSWORD: crud_password_change_me
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: crud_produtos
      MYSQL_USER: crud_user
      MYSQL_PASSWORD: crud_password_change_me
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysql-dados:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mysql-dados:
